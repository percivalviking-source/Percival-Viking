<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <title>Lote LEGO | Percival Viking</title>


  <!-- CSS OFICIAL DO SITE -->
  <link
    rel="stylesheet"
    href="/assets/css/style.css"
  >


  <!-- CSS EXCLUSIVO DO CATÁLOGO -->
  <link
    rel="stylesheet"
    href="/assets/css/lotes.css"
  >

</head>


<body>


  <!-- CABEÇALHO OFICIAL -->
  <div id="cabecalho"></div>


  <!-- CONTEÚDO DO CATÁLOGO -->
  <main
    id="conteudo-principal"
    class="site-main"
  >

    <div id="body-lotes"></div>

  </main>


  <!-- RODAPÉ OFICIAL -->
  <div id="rodape"></div>



  <script>

    /*
      ==========================================
      CARREGAR PARTIAL
      ==========================================
    */

    async function carregarPartial(
      id,
      arquivo
    ) {

      const destino =
        document.getElementById(id);


      if (!destino) {

        console.error(
          `Elemento #${id} não encontrado.`
        );

        return;

      }


      try {

        const resposta =
          await fetch(
            arquivo,
            {
              cache: "no-store"
            }
          );


        if (!resposta.ok) {

          throw new Error(
            `Erro ${resposta.status} ao carregar ${arquivo}`
          );

        }


        destino.innerHTML =
          await resposta.text();

      }


      catch (erro) {

        console.error(
          `Erro ao carregar ${arquivo}:`,
          erro
        );


        destino.innerHTML = `

          <p
            style="
              max-width:900px;
              margin:20px auto;
              padding:16px;
              color:#6b7280;
              text-align:center;
            "
          >

            Não foi possível carregar
            esta parte da página.

          </p>

        `;

      }

    }



    /*
      ==========================================
      CARREGAR SCRIPT
      ==========================================
    */

    function carregarScript(
      arquivo
    ) {

      return new Promise(
        (resolve, reject) => {


          const script =
            document.createElement(
              "script"
            );


          script.src =
            arquivo;


          script.onload =
            resolve;


          script.onerror =
            () => {

              reject(
                new Error(
                  `Erro ao carregar ${arquivo}`
                )
              );

            };


          document.body.appendChild(
            script
          );

        }
      );

    }



    /*
      ==========================================
      INICIAR PÁGINA
      ==========================================
    */

    async function iniciarPagina() {

      try {


        /*
          Primeiro montamos:

          cabeçalho
          catálogo
          rodapé
        */

        await Promise.all([


          carregarPartial(
            "cabecalho",
            "/partials/cabecalho.html"
          ),


          carregarPartial(
            "body-lotes",
            "/partials/body-lotes.html"
          ),


          carregarPartial(
            "rodape",
            "/partials/rodape.html"
          )


        ]);



        /*
          Depois ligamos o JS oficial
          do Percival Viking.

          Ele cuida do cabeçalho,
          menu, pesquisa global etc.
        */

        await carregarScript(
          "/assets/js/app.js"
        );



        /*
          Por último ligamos
          o catálogo LEGO.
        */

        await carregarScript(
          "/assets/js/lotes.js"
        );


      }


      catch (erro) {

        console.error(
          "Erro ao iniciar página de lotes:",
          erro
        );

      }

    }



    /*
      ==========================================
      START
      ==========================================
    */

    iniciarPagina();

  </script>


</body>

</html>
