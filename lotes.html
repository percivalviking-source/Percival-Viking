<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- Catálogo privado/temporário: evita indexação -->
  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <title>Lote LEGO | Percival Viking</title>
</head>

<body>

  <!-- CABEÇALHO -->
  <div id="cabecalho"></div>


  <!-- CONTEÚDO -->
  <main id="conteudo-principal">

    <div id="body-lotes"></div>

  </main>


  <!-- RODAPÉ -->
  <div id="rodape"></div>


  <script>

    /*
      ==============================
      CARREGAR PARTIAL
      ==============================
    */

    async function carregarPartial(id, arquivo) {

      const destino =
        document.getElementById(id);

      try {

        const resposta =
          await fetch(arquivo);

        if (!resposta.ok) {

          throw new Error(
            `Erro ${resposta.status} ao carregar ${arquivo}`
          );

        }

        destino.innerHTML =
          await resposta.text();

      }

      catch (erro) {

        console.error(erro);

        destino.innerHTML = `
          <p
            style="
              max-width:900px;
              margin:20px auto;
              padding:16px;
              font-family:Arial,sans-serif;
              color:#555;
            "
          >
            Não foi possível carregar esta parte da página.
          </p>
        `;

      }

    }



    /*
      ==============================
      CARREGAR JAVASCRIPT
      ==============================

      O lotes.js só é carregado
      depois que body-lotes.html
      já estiver dentro da página.
    */

    function carregarScript(arquivo) {

      return new Promise(
        (resolve, reject) => {

          const script =
            document.createElement("script");

          script.src = arquivo;

          script.onload =
            resolve;

          script.onerror =
            () => reject(
              new Error(
                `Erro ao carregar ${arquivo}`
              )
            );

          document.body.appendChild(
            script
          );

        }
      );

    }



    /*
      ==============================
      INICIAR PÁGINA
      ==============================
    */

    async function iniciarPagina() {

      try {

        /*
          Carrega cabeçalho,
          corpo e rodapé
          simultaneamente.
        */

        await Promise.all([

          carregarPartial(
            "cabecalho",
            "partials/cabecalho.html"
          ),

          carregarPartial(
            "body-lotes",
            "partials/body-lotes.html"
          ),

          carregarPartial(
            "rodape",
            "partials/rodape.html"
          )

        ]);


        /*
          Agora que o body-lotes
          já existe, ligamos
          o motor do catálogo.
        */

        await carregarScript(
          "assets/js/lotes.js"
        );

      }

      catch (erro) {

        console.error(
          "Erro ao iniciar página de lotes:",
          erro
        );

      }

    }



    /*
      ==============================
      START
      ==============================
    */

    iniciarPagina();

  </script>

</body>

</html>
