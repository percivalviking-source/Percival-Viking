<header class="site-header">
  <div class="header-inner">

    <button
      class="icon-button menu-button"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      data-menu-open
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a class="brand" href="/" aria-label="Percival Viking - início">
      <img class="brand-logo" src="/assets/img/logo-percival-viking.png" alt="">
      <span class="brand-name">Percival <strong>Viking</strong></span>
    </a>

    <button
      class="icon-button search-button"
      type="button"
      aria-label="Buscar"
      aria-expanded="false"
      data-search-open
    >
      ⌕
    </button>

  </div>

  <nav class="desktop-nav" aria-label="Categorias">
    <a href="/">Início</a>
    <a href="#">Colecionismo</a>
    <a href="#">Pokémon</a>
    <a href="#">Esportes</a>
    <a href="#">LEGO®</a>
  </nav>
</header>

<div class="menu-overlay" data-menu-close></div>

<aside class="mobile-menu" aria-label="Menu principal">

  <div class="mobile-menu-header">
    <a class="mobile-menu-brand" href="/">
      <img src="/assets/img/logo-percival-viking.png" alt="">
      <span>Percival <strong>Viking</strong></span>
    </a>

    <button
      class="mobile-menu-close"
      type="button"
      aria-label="Fechar menu"
      data-menu-close
    >
      ×
    </button>
  </div>

  <nav class="mobile-menu-nav">
    <a href="/">Início</a>
    <a href="#">Colecionismo</a>
    <a href="#">Pokémon</a>
    <a href="#">Esportes</a>
    <a href="#">LEGO®</a>
  </nav>

  <div class="mobile-menu-footer">
    <p>
      Notícias, guias e cultura geek com alma de colecionador brasileiro.
    </p>
  </div>

</aside>

<div class="search-overlay" data-search-close></div>

<section
  class="search-panel"
  role="dialog"
  aria-modal="true"
  aria-label="Busca do Percival Viking"
>
  <div class="search-panel-inner">

    <div class="search-panel-header">
      <div>
        <span class="eyebrow">Busca</span>
        <h2>Encontre uma travessia</h2>
      </div>

      <button
        class="search-close"
        type="button"
        aria-label="Fechar busca"
        data-search-close
      >
        ×
      </button>
    </div>

    <div class="search-box">
      <input
        type="search"
        placeholder="Buscar por Copa, Pokémon, LEGO, TCG..."
        aria-label="Buscar artigos"
        data-search-input
      >
    </div>

    <p class="search-status" data-search-status>
      Digite para buscar nos artigos do Percival Viking.
    </p>

    <div class="search-results" data-search-results></div>

  </div>
</section>
